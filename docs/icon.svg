<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Seamless">
  <!-- fond : carré arrondi sombre, couleur de fond du thème (#0b0c0f) -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="#0b0c0f"/>
  <rect x="7" y="7" width="242" height="242" rx="49" fill="none" stroke="#262b33" stroke-width="4"/>
  <!-- triangle play, accent vert du thème (#34d399), lisible à 32 px -->
  <path d="M44 68 L44 188 L132 128 Z" fill="#34d399" stroke="#34d399" stroke-width="16" stroke-linejoin="round"/>
  <!-- barres d'égaliseur -->
  <g fill="#34d399">
    <rect x="152" y="104" width="16" height="48" rx="8"/>
    <rect x="178" y="80" width="16" height="96" rx="8"/>
    <rect x="204" y="112" width="16" height="32" rx="8"/>
  </g>
</svg>
